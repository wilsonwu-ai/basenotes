<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The oud ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=EB+Garamond:ital@0;1&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --paper:#faf6ec;
    --ink:#1b2f22;
    --muted:#5c574d;
    --gold:#b8904f;
    --font-display:'Playfair Display', Georgia, serif;
    --font-serif:'EB Garamond', Georgia, serif;
    --font-sans:'Jost', system-ui, sans-serif;
  }
  body{
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3rem 1.5rem;
  }
  .frame{max-width:820px;width:100%;}
  .eyebrow{
    font-family:var(--font-sans);
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:.6rem;
  }
  h1{
    font-family:var(--font-display);
    font-size:clamp(1.6rem,2.4vw + .8rem,2.1rem);
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.15;
    color:var(--ink);
    margin-bottom:1.75rem;
  }
  svg{width:100%;min-width:560px;display:block;}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Oud Fragrance Guide</p>
  <h1>The oud ladder: simplest to boldest</h1>
  <svg viewBox="0 0 900 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oud-ladder-title oud-ladder-desc">
    <title id="oud-ladder-title">The oud ladder: simplest to boldest</title>
    <desc id="oud-ladder-desc">A four rung ladder from simplest at the bottom to boldest at the top: 1, Woods and warm spice, Tom Ford Oud Wood, notes include cardamom, oud and tonka bean; 2, Layered and elegant, Xerjoff Alexandria II, notes include cinnamon, Laotian oud and vanilla; 3, Fruit and a strong oud, Bond No. 9 Nomad, notes include pear, oud accord and rose; 4, Leather and praline, Parfums de Marly Haltane, notes include praline, oud and leather.</desc>

    <rect width="100%" height="100%" fill="#faf6ec"/>

    <!-- axis end labels -->
    <text x="100" y="66" text-anchor="middle" font-family="var(--font-sans)" font-size="15" font-weight="600" letter-spacing="0.12em" fill="#b8904f">BOLDEST</text>
    <text x="100" y="772" text-anchor="middle" font-family="var(--font-sans)" font-size="15" font-weight="600" letter-spacing="0.12em" fill="#b8904f">SIMPLEST</text>

    <!-- ladder rails -->
    <line x1="72" y1="100" x2="72" y2="740" stroke="#1b2f22" stroke-width="3" stroke-linecap="round"/>
    <line x1="128" y1="100" x2="128" y2="740" stroke="#1b2f22" stroke-width="3" stroke-linecap="round"/>

    <!-- upward arrow along the ladder axis -->
    <defs>
      <marker id="arrow-gold-2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
        <polygon points="0 0, 9 4, 0 8" fill="#b8904f"/>
      </marker>
    </defs>
    <line x1="100" y1="720" x2="100" y2="118" stroke="#b8904f" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" marker-end="url(#arrow-gold-2)"/>

    <!-- RUNG 4 (top) -->
    <line x1="72" y1="200" x2="128" y2="200" stroke="#1b2f22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="200" r="9" fill="#faf6ec" stroke="#b8904f" stroke-width="2.5"/>
    <text x="100" y="205" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="#1b2f22">4</text>
    <text x="176" y="180" font-family="var(--font-sans)" font-size="18" font-weight="500" letter-spacing="0.04em" fill="#5c574d">LEATHER AND PRALINE</text>
    <text x="176" y="212" font-family="var(--font-display)" font-size="26" font-weight="700" fill="#1b2f22">Parfums de Marly Haltane</text>
    <text x="176" y="240" font-family="var(--font-serif)" font-style="italic" font-size="20" fill="#5c574d">Notes include praline, oud and leather</text>

    <!-- RUNG 3 -->
    <line x1="72" y1="360" x2="128" y2="360" stroke="#1b2f22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="360" r="9" fill="#faf6ec" stroke="#b8904f" stroke-width="2.5"/>
    <text x="100" y="365" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="#1b2f22">3</text>
    <text x="176" y="340" font-family="var(--font-sans)" font-size="18" font-weight="500" letter-spacing="0.04em" fill="#5c574d">FRUIT AND A STRONG OUD</text>
    <text x="176" y="372" font-family="var(--font-display)" font-size="26" font-weight="700" fill="#1b2f22">Bond No. 9 Nomad</text>
    <text x="176" y="400" font-family="var(--font-serif)" font-style="italic" font-size="20" fill="#5c574d">Notes include pear, oud accord and rose</text>

    <!-- RUNG 2 -->
    <line x1="72" y1="520" x2="128" y2="520" stroke="#1b2f22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="520" r="9" fill="#faf6ec" stroke="#b8904f" stroke-width="2.5"/>
    <text x="100" y="525" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="#1b2f22">2</text>
    <text x="176" y="500" font-family="var(--font-sans)" font-size="18" font-weight="500" letter-spacing="0.04em" fill="#5c574d">LAYERED AND ELEGANT</text>
    <text x="176" y="532" font-family="var(--font-display)" font-size="26" font-weight="700" fill="#1b2f22">Xerjoff Alexandria II</text>
    <text x="176" y="560" font-family="var(--font-serif)" font-style="italic" font-size="20" fill="#5c574d">Notes include cinnamon, Laotian oud and vanilla</text>

    <!-- RUNG 1 (bottom) -->
    <line x1="72" y1="680" x2="128" y2="680" stroke="#1b2f22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="680" r="9" fill="#faf6ec" stroke="#b8904f" stroke-width="2.5"/>
    <text x="100" y="685" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="#1b2f22">1</text>
    <text x="176" y="660" font-family="var(--font-sans)" font-size="18" font-weight="500" letter-spacing="0.04em" fill="#5c574d">WOODS AND WARM SPICE</text>
    <text x="176" y="692" font-family="var(--font-display)" font-size="26" font-weight="700" fill="#1b2f22">Tom Ford Oud Wood</text>
    <text x="176" y="720" font-family="var(--font-serif)" font-style="italic" font-size="20" fill="#5c574d">Notes include cardamom, oud and tonka bean</text>

    <!-- caption -->
    <line x1="72" y1="790" x2="828" y2="790" stroke="rgba(27,47,34,0.15)" stroke-width="1"/>
    <text x="72" y="820" font-family="var(--font-serif)" font-style="italic" font-size="18" fill="#5c574d">Placement is Base Note&#8217;s reading of each maker&#8217;s official notes and descriptions.</text>
  </svg>
</div>
</body>
</html>
