<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What makes a perfume niche?</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f4efe3;
    --ink: #24372b;
    --green: #22392b;
    --muted: #62675d;
    --gold: #ac9159;
    --line: #d9d4c8;
    --font-sans: 'Jost', sans-serif;
    --font-serif: 'Playfair Display', serif;
  }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--ink);
    width: 1200px;
    padding: 48px;
  }
  .frame { width: 1120px; }
  .eyebrow {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 24px;
  }
  svg { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Explained simply</p>
    <h1>What makes a perfume niche?</h1>
    <svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig01-title fig01-desc">
      <title id="fig01-title">What makes a perfume niche?</title>
      <desc id="fig01-desc">Picture explainer comparing a fashion house that sells clothes, bags and perfume with a niche house that only makes perfume, above a three-part strip showing top, heart and base notes.</desc>

      <rect width="1120" height="760" fill="#f4efe3"/>

      <!-- Left panel: Fashion house -->
      <rect x="40" y="80" width="500" height="280" rx="8" fill="#ffffff" stroke="#24372b" stroke-opacity="0.15" stroke-width="1"/>
      <text x="290" y="128" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="600" fill="#24372b">Fashion house</text>

      <!-- shirt icon -->
      <g transform="translate(120,170)">
        <rect x="-8" y="0" width="20" height="14" rx="3" fill="#f4efe3" stroke="#62675d" stroke-width="1.5"/>
        <rect x="16" y="0" width="20" height="14" rx="3" fill="#f4efe3" stroke="#62675d" stroke-width="1.5" transform="translate(24,0)"/>
        <path d="M4 4 L4 68 L52 68 L52 4 L40 4 L36 14 L20 14 L16 4 Z" fill="#f4efe3" stroke="#62675d" stroke-width="2"/>
      </g>

      <!-- handbag icon -->
      <g transform="translate(260,182)">
        <path d="M6 0 Q28 -32 50 0" fill="none" stroke="#62675d" stroke-width="3"/>
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#f4efe3" stroke="#62675d" stroke-width="2"/>
      </g>

      <!-- small perfume bottle icon -->
      <g transform="translate(420,168)">
        <rect x="14" y="0" width="12" height="8" rx="1" fill="#62675d"/>
        <rect x="17" y="8" width="6" height="6" fill="#62675d"/>
        <rect x="6" y="14" width="28" height="46" rx="4" fill="#f4efe3" stroke="#62675d" stroke-width="2"/>
      </g>

      <text x="290" y="292" text-anchor="middle" font-family="'Jost', sans-serif" font-size="17" fill="#62675d">Perfume is one thing it sells</text>
      <text x="290" y="316" text-anchor="middle" font-family="'Jost', sans-serif" font-size="17" fill="#62675d">among many</text>

      <!-- Right panel: Niche perfume house (focal) -->
      <rect x="580" y="80" width="500" height="280" rx="8" fill="#ac9159" fill-opacity="0.08" stroke="#ac9159" stroke-width="1.5"/>
      <text x="830" y="128" text-anchor="middle" font-family="'Playfair Display', serif" font-size="24" font-weight="600" fill="#24372b">Niche perfume house</text>

      <!-- large perfume bottle icon -->
      <g transform="translate(786,160)">
        <rect x="30" y="0" width="24" height="16" rx="2" fill="#ac9159"/>
        <rect x="36" y="16" width="12" height="10" fill="#ac9159"/>
        <rect x="12" y="26" width="60" height="86" rx="8" fill="#ffffff" stroke="#ac9159" stroke-width="3"/>
      </g>

      <text x="830" y="292" text-anchor="middle" font-family="'Jost', sans-serif" font-size="17" fill="#24372b" font-weight="500">Perfume is the whole business</text>

      <!-- Notes strip -->
      <rect x="40" y="400" width="1040" height="260" rx="8" fill="#ffffff" stroke="#24372b" stroke-opacity="0.12" stroke-width="1"/>
      <text x="560" y="436" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#24372b">Notes: the smells you notice</text>

      <!-- three columns -->
      <rect x="64" y="460" width="304" height="164" rx="6" fill="#ac9159" fill-opacity="0.12"/>
      <rect x="408" y="460" width="304" height="164" rx="6" fill="#62675d" fill-opacity="0.12"/>
      <rect x="752" y="460" width="304" height="164" rx="6" fill="#22392b" fill-opacity="0.14"/>

      <text x="216" y="492" text-anchor="middle" font-family="'Jost', sans-serif" font-size="14" font-weight="600" letter-spacing="0.1em" fill="#8a6a34">TOP</text>
      <text x="216" y="524" text-anchor="middle" font-family="'Jost', sans-serif" font-size="15" fill="#24372b">Bright smells you</text>
      <text x="216" y="546" text-anchor="middle" font-family="'Jost', sans-serif" font-size="15" fill="#24372b">notice first</text>

      <text x="560" y="492" text-anchor="middle" font-family="'Jost', sans-serif" font-size="14" font-weight="600" letter-spacing="0.1em" fill="#4c5145">HEART</text>
      <text x="560" y="524" text-anchor="middle" font-family="'Jost', sans-serif" font-size="15" fill="#24372b">The middle of</text>
      <text x="560" y="546" text-anchor="middle" font-family="'Jost', sans-serif" font-size="15" fill="#24372b">the scent</text>

      <text x="904" y="492" text-anchor="middle" font-family="'Jost', sans-serif" font-size="14" font-weight="600" letter-spacing="0.1em" fill="#22392b">BASE</text>
      <text x="904" y="524" text-anchor="middle" font-family="'Jost', sans-serif" font-size="15" fill="#24372b">Deep smells</text>
      <text x="904" y="546" text-anchor="middle" font-family="'Jost', sans-serif" font-size="15" fill="#24372b">underneath</text>

      <!-- footer -->
      <line x1="60" y1="690" x2="1060" y2="690" stroke="#d9d4c8" stroke-width="1"/>
      <text x="560" y="726" text-anchor="middle" font-family="'Playfair Display', serif" font-style="italic" font-size="18" fill="#24372b">Pick the notes you like, then try a small bottle first.</text>
    </svg>
  </div>
</body>
</html>
