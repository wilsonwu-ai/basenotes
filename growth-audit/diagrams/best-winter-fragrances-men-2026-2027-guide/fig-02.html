<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter scent map</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=EB+Garamond:ital@0;1&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --paper:#f4efe3;
    --ink:#1b2f22;
    --muted:#5c574d;
    --gold:#8c7037;
    --serif:'EB Garamond', Georgia, serif;
    --display:'Playfair Display', Georgia, serif;
    --sans:'Jost', sans-serif;
  }
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.5rem 2rem;
  }
  .frame{max-width:1120px;width:100%;}
  .eyebrow{
    font-family:var(--sans);
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:.5rem;
  }
  h1{
    font-family:var(--display);
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--ink);
    margin-bottom:.4rem;
  }
  .sub{
    font-family:var(--serif);
    font-style:italic;
    font-size:.98rem;
    color:var(--muted);
    margin-bottom:1.5rem;
  }
  svg{width:100%;display:block;}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Scent map &middot; Base Note</p>
  <h1>Winter scent map: seven picks by their official notes</h1>
  <p class="sub">Placement is Base Note's reading of each brand's official notes, not a measurement.</p>
  <svg viewBox="0 0 1080 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig02-title fig02-desc">
    <title id="fig02-title">Winter scent map plotting seven fragrances by freshness and richness</title>
    <desc id="fig02-desc">A two-by-two map running fresh to warm across and light to rich up, placing Creed Santal near fresh-light, Parfums de Marly Layton near the center, and Xerjoff Alexandria II, Tom Ford Oud Wood, Parfums de Marly Althair, Viktor and Rolf Spicebomb Extreme, and Initio Side Effect toward the warm and rich corner.</desc>
    <defs>
      <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
        <polygon points="0 0, 9 3.5, 0 7" fill="#1b2f22"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f4efe3"/>

    <!-- Quadrant tints (very light, position + label carries the meaning) -->
    <rect x="150" y="100" width="350" height="260" fill="#1b2f22" opacity="0.03"/>
    <rect x="500" y="100" width="350" height="260" fill="#8c7037" opacity="0.05"/>
    <rect x="150" y="360" width="350" height="260" fill="#1b2f22" opacity="0.015"/>
    <rect x="500" y="360" width="350" height="260" fill="#1b2f22" opacity="0.03"/>

    <!-- quadrant corner tags (top-right sits near the axis cross, not the outer corner, since the data cluster occupies that corner) -->
    <text x="176" y="128" font-family="'Jost', sans-serif" font-size="10" font-weight="600" letter-spacing="0.14em" fill="#5c574d" text-transform="uppercase">FRESH AND RICH</text>
    <text x="520" y="350" font-family="'Jost', sans-serif" font-size="10" font-weight="600" letter-spacing="0.14em" fill="#8c7037" text-transform="uppercase">WARM AND RICH</text>
    <text x="176" y="596" font-family="'Jost', sans-serif" font-size="10" font-weight="600" letter-spacing="0.14em" fill="#5c574d" text-transform="uppercase">FRESH AND LIGHT</text>
    <text x="824" y="596" text-anchor="end" font-family="'Jost', sans-serif" font-size="10" font-weight="600" letter-spacing="0.14em" fill="#5c574d" text-transform="uppercase">WARM AND LIGHT</text>

    <!-- Axis cross -->
    <line x1="110" y1="360" x2="870" y2="360" stroke="#1b2f22" stroke-width="1.2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="60" x2="500" y2="660" stroke="#1b2f22" stroke-width="1.2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>

    <!-- Axis labels: Jobs-minimal, one word per tip -->
    <text x="98" y="364" text-anchor="end" dominant-baseline="middle" font-family="'Jost', sans-serif" font-size="12" letter-spacing="0.18em" fill="#1b2f22" text-transform="uppercase">FRESH</text>
    <text x="882" y="364" text-anchor="start" dominant-baseline="middle" font-family="'Jost', sans-serif" font-size="12" letter-spacing="0.18em" fill="#1b2f22" text-transform="uppercase">WARM</text>
    <text x="500" y="48" text-anchor="middle" font-family="'Jost', sans-serif" font-size="12" letter-spacing="0.18em" fill="#1b2f22" text-transform="uppercase">RICH</text>
    <text x="500" y="684" text-anchor="middle" font-family="'Jost', sans-serif" font-size="12" letter-spacing="0.18em" fill="#1b2f22" text-transform="uppercase">LIGHT</text>

    <!-- Points: x0-10 -> px150..850 (fresh->warm), y0-10 -> py620..100 (light->rich) -->
    <!-- Each label is anchored on the side of its dot with the most open canvas, spaced so none crosses another. -->

    <!-- 4. Creed Santal (3.5, 4.5) — label below -->
    <circle cx="395" cy="386" r="6" fill="#1b2f22"/>
    <rect x="316" y="400" width="158" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="395" y="412" text-anchor="middle" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#1b2f22">4 &middot; Creed Santal</text>

    <!-- 1. Parfums de Marly Layton (4.5, 5.5) — RANK 1, focal accent, label to the left (open canvas) -->
    <circle cx="465" cy="334" r="8" fill="#f0e2c4" stroke="#8c7037" stroke-width="2"/>
    <circle cx="465" cy="334" r="3" fill="#8c7037"/>
    <rect x="228" y="326" width="224" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="446" y="338" text-anchor="end" font-family="'Jost', sans-serif" font-size="12" font-weight="600" fill="#8c7037">1 &middot; Parfums de Marly Layton</text>

    <!-- 2. Xerjoff Alexandria II (6, 7.5) — label to the left -->
    <circle cx="570" cy="230" r="6" fill="#1b2f22"/>
    <rect x="404" y="222" width="150" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="550" y="234" text-anchor="end" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#1b2f22">2 &middot; Xerjoff Alexandria II</text>

    <!-- 3. Tom Ford Oud Wood (7, 8.5) — label above-left -->
    <circle cx="640" cy="178" r="6" fill="#1b2f22"/>
    <rect x="480" y="158" width="144" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="620" y="170" text-anchor="end" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#1b2f22">3 &middot; Tom Ford Oud Wood</text>

    <!-- 5. Parfums de Marly Althair (7, 6.5) — label below -->
    <circle cx="640" cy="282" r="6" fill="#1b2f22"/>
    <rect x="530" y="300" width="220" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="640" y="312" text-anchor="middle" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#1b2f22">5 &middot; Parfums de Marly Althair</text>

    <!-- 6. Viktor & Rolf Spicebomb Extreme (8.5, 8) — label to the right -->
    <circle cx="745" cy="204" r="6" fill="#1b2f22"/>
    <rect x="757" y="196" width="300" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="765" y="208" text-anchor="start" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#1b2f22">6 &middot; Viktor &amp; Rolf Spicebomb Extreme</text>

    <!-- 7. Initio Side Effect (9.5, 9.5) — label to the right, clear of the corner tag which now sits near the axis cross -->
    <circle cx="815" cy="126" r="6" fill="#1b2f22"/>
    <rect x="827" y="118" width="180" height="16" rx="2" fill="#f4efe3" opacity="0.85"/>
    <text x="835" y="130" text-anchor="start" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#1b2f22">7 &middot; Initio Side Effect</text>

    <!-- Legend -->
    <line x1="60" y1="716" x2="1020" y2="716" stroke="rgba(27,47,34,0.15)" stroke-width="0.8"/>
    <text x="60" y="738" font-family="'Jost', sans-serif" font-size="9" letter-spacing="0.18em" fill="#5c574d" text-transform="uppercase">LEGEND</text>
    <circle cx="260" cy="734" r="6" fill="#1b2f22"/>
    <text x="276" y="738" font-family="'Jost', sans-serif" font-size="11" fill="#5c574d">Ranked pick</text>
    <circle cx="420" cy="734" r="8" fill="#f0e2c4" stroke="#8c7037" stroke-width="2"/>
    <circle cx="420" cy="734" r="3" fill="#8c7037"/>
    <text x="438" y="738" font-family="'Jost', sans-serif" font-size="11" fill="#5c574d">Top pick (rank 1)</text>
    <text x="1020" y="738" text-anchor="end" font-family="'EB Garamond', serif" font-style="italic" font-size="11" fill="#5c574d">Based on each brand's published notes, not a lab measurement.</text>
  </svg>
</div>
</body>
</html>
