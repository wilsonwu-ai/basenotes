<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter scent, explained simply</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=EB+Garamond:ital@0;1&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --paper:#f4efe3;
    --ink:#1b2f22;
    --muted:#5c574d;
    --gold:#8c7037;
    --serif:'EB Garamond', Georgia, serif;
    --display:'Playfair Display', Georgia, serif;
    --sans:'Jost', sans-serif;
  }
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.5rem 2rem;
  }
  .frame{max-width:1120px;width:100%;}
  .eyebrow{
    font-family:var(--sans);
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:.5rem;
  }
  h1{
    font-family:var(--display);
    font-size:2rem;
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--ink);
    margin-bottom:1.5rem;
  }
  svg{width:100%;display:block;}
</style>
</head>
<body>
<div class="frame">
  <svg viewBox="0 0 1240 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig01-title fig01-desc">
    <title id="fig01-title">Winter scent, explained simply</title>
    <desc id="fig01-desc">Three panels: notes are the smells a perfume lists; they run from cool and bright to cozy and warm; in winter, pick cozy and spray light.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#8c7037"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f4efe3"/>

    <!-- Connector arrows between panels (drawn first) -->
    <line x1="388" y1="264" x2="428" y2="264" stroke="#8c7037" stroke-width="2.4" marker-end="url(#arrow)"/>
    <line x1="808" y1="264" x2="848" y2="264" stroke="#8c7037" stroke-width="2.4" marker-end="url(#arrow)"/>

    <!-- Panel 1: notes card -->
    <g>
      <rect x="40" y="80" width="348" height="368" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>

      <!-- peppercorn -->
      <circle cx="120" cy="220" r="24" fill="#1b2f22"/>
      <circle cx="112" cy="212" r="6" fill="#3a4a3d"/>
      <text x="120" y="272" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" fill="#5c574d">Pepper</text>

      <!-- vanilla pod -->
      <path d="M170 260 Q214 236 258 260 Q214 284 170 260 Z" fill="#8c7037"/>
      <text x="214" y="304" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" fill="#5c574d">Vanilla</text>

      <!-- wood slice -->
      <ellipse cx="308" cy="260" rx="26" ry="26" fill="none" stroke="#5c574d" stroke-width="3"/>
      <ellipse cx="308" cy="260" rx="17" ry="17" fill="none" stroke="#5c574d" stroke-width="2"/>
      <ellipse cx="308" cy="260" rx="8" ry="8" fill="none" stroke="#5c574d" stroke-width="1.5"/>
      <text x="308" y="304" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" fill="#5c574d">Wood</text>

      <rect x="72" y="352" width="284" height="1" fill="#1b2f22" opacity="0.15"/>
      <text x="214" y="406" text-anchor="middle" font-family="'EB Garamond', serif" font-style="italic" font-size="22" fill="#1b2f22">Notes = the smells a perfume lists</text>
    </g>

    <!-- Panel 2: split card fresh vs cozy -->
    <g>
      <rect x="428" y="80" width="380" height="368" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
      <line x1="618" y1="80" x2="618" y2="448" stroke="#1b2f22" stroke-width="1" opacity="0.2"/>

      <!-- left: cool -->
      <rect x="428" y="80" width="190" height="368" rx="8" fill="#dfe7d8"/>
      <rect x="618" y="80" width="0" height="0"/>
      <ellipse cx="480" cy="220" rx="30" ry="24" fill="#c9d64f" opacity="0.9"/>
      <path d="M480 196 L486 206 L474 206 Z" fill="#5c7a4a"/>
      <path d="M540 240 q-8 -34 18 -44 q6 26 -18 44 Z" fill="#5c9457"/>
      <text x="523" y="406" text-anchor="middle" font-family="'EB Garamond', serif" font-style="italic" font-size="22" fill="#1b2f22">Cool, bright</text>

      <!-- right: cozy -->
      <rect x="618" y="80" width="190" height="368" rx="8" fill="#f0e2c4"/>
      <rect x="670" y="196" width="10" height="48" rx="4" fill="#8c5a34"/>
      <path d="M672 196 q3 -12 8 0 q3 -12 6 0" fill="none" stroke="#8c5a34" stroke-width="2.5"/>
      <ellipse cx="740" cy="230" rx="26" ry="26" fill="none" stroke="#5c574d" stroke-width="3"/>
      <path d="M700 260 Q713 244 726 260 Q713 276 700 260 Z" fill="#8c7037"/>
      <text x="713" y="406" text-anchor="middle" font-family="'EB Garamond', serif" font-style="italic" font-size="22" fill="#1b2f22">Cozy, warm</text>
    </g>

    <!-- Panel 3: scarf + atomizer, window -->
    <g>
      <rect x="848" y="80" width="352" height="368" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
      <!-- window -->
      <rect x="884" y="112" width="120" height="140" rx="4" fill="#dfe7e8" stroke="#1b2f22" stroke-width="1.5"/>
      <line x1="944" y1="112" x2="944" y2="252" stroke="#1b2f22" stroke-width="1.2"/>
      <line x1="884" y1="182" x2="1004" y2="182" stroke="#1b2f22" stroke-width="1.2"/>
      <circle cx="905" cy="140" r="3" fill="#ffffff"/>
      <circle cx="925" cy="150" r="3" fill="#ffffff"/>
      <circle cx="915" cy="165" r="3" fill="#ffffff"/>
      <!-- warm room glow -->
      <rect x="1024" y="112" width="152" height="140" rx="4" fill="#f0e2c4"/>
      <circle cx="1100" cy="150" r="20" fill="#8c7037" opacity="0.5"/>

      <!-- scarf -->
      <rect x="884" y="288" width="150" height="34" rx="8" fill="#2d3d31"/>
      <rect x="884" y="326" width="150" height="34" rx="8" fill="#2d3d31"/>
      <rect x="900" y="360" width="18" height="36" fill="#2d3d31"/>

      <!-- atomizer -->
      <rect x="1064" y="300" width="40" height="80" rx="4" fill="none" stroke="#1b2f22" stroke-width="2.5"/>
      <rect x="1076" y="284" width="16" height="20" rx="2" fill="#8c7037"/>
      <rect x="1082" y="272" width="4" height="16" fill="#5c574d"/>

      <text x="1024" y="430" text-anchor="middle" font-family="'EB Garamond', serif" font-style="italic" font-size="22" fill="#1b2f22">Winter: pick cozy, spray light</text>
    </g>
  </svg>
</div>
</body>
</html>
