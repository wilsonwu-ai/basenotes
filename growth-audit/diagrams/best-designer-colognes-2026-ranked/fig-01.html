<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designer cologne, explained simply</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --cream:#f4efe3;
    --green:#22392b;
    --green-dark:#1b2f22;
    --ink:#24372b;
    --gold:#ac9159;
    --muted:#62675d;
    --line:#d9d4c8;
    --font-display:'Playfair Display', Georgia, serif;
    --font-serif:'EB Garamond', Georgia, serif;
    --font-sans:'Jost', sans-serif;
  }
  html,body{background:var(--cream);}
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    width:1200px;
    height:700px;
    overflow:hidden;
  }
  svg{width:1200px;height:700px;display:block;}
</style>
</head>
<body>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig01-title fig01-desc">
<title id="fig01-title">Designer cologne, explained simply</title>
<desc id="fig01-desc">Three panels: a fashion-house shop front, a card splitting fresh notes from warm notes, and a small 5 ml atomizer beside a larger bottle, with the line: try small first, then choose.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#ac9159"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#f4efe3"/>

<!-- Title -->
<text x="600" y="78" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="42" fill="#22392b">Designer cologne, explained simply</text>

<!-- Connecting arrows (drawn before panels) -->
<line x1="368" y1="345" x2="428" y2="345" stroke="#ac9159" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="768" y1="345" x2="828" y2="345" stroke="#ac9159" stroke-width="2.4" marker-end="url(#arrow)"/>

<!-- ================= PANEL 1 : SHOP FRONT ================= -->
<rect x="40" y="140" width="320" height="400" rx="8" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.2"/>

<g>
  <polygon points="120,236 280,236 260,196 140,196" fill="#22392b"/>
  <rect x="132" y="236" width="136" height="28" fill="#1b2f22"/>
  <path d="M200 244 v4 M188 260 q12 -14 24 0" stroke="#f4efe3" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <rect x="120" y="264" width="160" height="140" fill="#ffffff" stroke="#22392b" stroke-width="2"/>
  <rect x="134" y="280" width="52" height="60" fill="#e9e2d0" stroke="#22392b" stroke-width="1.6"/>
  <rect x="214" y="280" width="52" height="60" fill="#e9e2d0" stroke="#22392b" stroke-width="1.6"/>
  <rect x="186" y="352" width="28" height="52" fill="#22392b"/>
</g>

<text x="200" y="478" text-anchor="middle" font-family="'Jost', sans-serif" font-size="22" font-weight="500" fill="#24372b">Fashion house</text>

<!-- ================= PANEL 2 : NOTES SPLIT CARD ================= -->
<rect x="440" y="140" width="320" height="400" rx="8" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.2"/>

<rect x="472" y="196" width="112" height="208" rx="6" fill="#e4ecdf" stroke="#22392b" stroke-width="1.2"/>
<rect x="616" y="196" width="112" height="208" rx="6" fill="#ecdfc4" stroke="#ac9159" stroke-width="1.2"/>

<!-- lemon slice, left -->
<circle cx="528" cy="260" r="26" fill="#f4efe3" stroke="#22392b" stroke-width="2"/>
<circle cx="528" cy="260" r="17" fill="#e4ecdf" stroke="#22392b" stroke-width="1.2"/>
<line x1="528" y1="243" x2="528" y2="277" stroke="#22392b" stroke-width="1"/>
<line x1="511" y1="260" x2="545" y2="260" stroke="#22392b" stroke-width="1"/>
<line x1="517" y1="248" x2="539" y2="272" stroke="#22392b" stroke-width="1"/>
<line x1="539" y1="248" x2="517" y2="272" stroke="#22392b" stroke-width="1"/>

<!-- lavender sprig, left -->
<line x1="528" y1="322" x2="528" y2="378" stroke="#22392b" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="522" cy="326" r="4" fill="#8e8fc2"/>
<circle cx="534" cy="330" r="4" fill="#8e8fc2"/>
<circle cx="520" cy="336" r="4" fill="#8e8fc2"/>
<circle cx="536" cy="340" r="4" fill="#8e8fc2"/>
<circle cx="528" cy="344" r="4" fill="#8e8fc2"/>

<!-- vanilla pod, right -->
<rect x="654" y="232" width="18" height="56" rx="9" fill="#5c3a1e" transform="rotate(-18 663 260)"/>

<!-- wood slice, right -->
<circle cx="694" cy="344" r="24" fill="#c99a5b" stroke="#5c3a1e" stroke-width="2"/>
<circle cx="694" cy="344" r="16" fill="none" stroke="#5c3a1e" stroke-width="1"/>
<circle cx="694" cy="344" r="8" fill="none" stroke="#5c3a1e" stroke-width="1"/>

<text x="528" y="462" text-anchor="middle" font-family="'Jost', sans-serif" font-size="22" font-weight="500" fill="#24372b">Fresh</text>
<text x="528" y="490" text-anchor="middle" font-family="'EB Garamond', serif" font-size="19" font-style="italic" fill="#62675d">cool and bright</text>

<text x="672" y="462" text-anchor="middle" font-family="'Jost', sans-serif" font-size="22" font-weight="500" fill="#24372b">Warm</text>
<text x="672" y="490" text-anchor="middle" font-family="'EB Garamond', serif" font-size="19" font-style="italic" fill="#62675d">cozy</text>

<!-- ================= PANEL 3 : TRY SMALL FIRST ================= -->
<rect x="840" y="140" width="320" height="400" rx="8" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.2"/>

<!-- larger bottle outline -->
<g>
  <rect x="972" y="268" width="64" height="136" rx="6" fill="none" stroke="#62675d" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="990" y="244" width="28" height="24" rx="3" fill="none" stroke="#62675d" stroke-width="2" stroke-dasharray="5,4"/>
</g>

<!-- small 5 ml atomizer, solid -->
<g>
  <rect x="900" y="316" width="30" height="88" rx="5" fill="#e9e2d0" stroke="#22392b" stroke-width="2"/>
  <rect x="906" y="292" width="18" height="26" rx="3" fill="#ac9159" stroke="#22392b" stroke-width="1.6"/>
  <rect x="911" y="280" width="8" height="14" rx="2" fill="#ac9159" stroke="#22392b" stroke-width="1.2"/>
</g>

<text x="1000" y="478" text-anchor="middle" font-family="'Jost', sans-serif" font-size="22" font-weight="500" fill="#24372b">5 ml atomizer</text>

<!-- ================= SINGLE LINE UNDER THE GRAPHIC ================= -->
<text x="600" y="616" text-anchor="middle" font-family="'EB Garamond', serif" font-size="30" font-style="italic" fill="#22392b">Try small first, then choose.</text>

</svg>
</body>
</html>
