<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clone or alternative</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital@0;1&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #faf6ec;
    --ink: #1b2f22;
    --muted: #5c574d;
    --gold: #b8904f;
    --line: rgba(34,57,43,.18);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-serif: 'EB Garamond', Georgia, serif;
    --font-sans: 'Jost', system-ui, sans-serif;
  }
  body {
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1000px; width: 100%; }
  svg { width: 100%; min-width: 720px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig01-title fig01-desc">
      <title id="fig01-title">Clone or alternative</title>
      <desc id="fig01-desc">Two panels. On the left, a recipe card is copied into an identical card, labelled as a clone. On the right, two different recipe cards share a bergamot and a lavender icon, labelled as an alternative.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5c574d"/>
        </marker>
        <symbol id="icon-bergamot" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
        </symbol>
        <symbol id="icon-lavender" viewBox="0 0 40 40">
          <line x1="20" y1="36" x2="20" y2="22" stroke="#1b2f22" stroke-width="2"/>
          <circle cx="20" cy="15" r="6" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
          <circle cx="11" cy="20" r="5" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
          <circle cx="29" cy="20" r="5" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
        </symbol>
        <symbol id="icon-triangle" viewBox="0 0 40 40">
          <polygon points="20,6 34,34 6,34" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-diamond" viewBox="0 0 40 40">
          <polygon points="20,4 36,20 20,36 4,20" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-hexagon" viewBox="0 0 40 40">
          <polygon points="20,4 34,12 34,28 20,36 6,28 6,12" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-star" viewBox="0 0 40 40">
          <path d="M20,4 L24,16 L36,20 L24,24 L20,36 L16,24 L4,20 L16,16 Z" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5" stroke-linejoin="round"/>
        </symbol>
      </defs>

      <rect width="100%" height="100%" fill="#faf6ec"/>

      <!-- top centre title -->
      <text x="500" y="44" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="28" fill="#1b2f22">Clone or alternative?</text>

      <!-- centre divider -->
      <line x1="500" y1="88" x2="500" y2="356" stroke="rgba(34,57,43,.18)" stroke-width="1"/>

      <!-- LEFT PANEL: clone -->
      <!-- arrow between the two identical cards -->
      <line x1="248" y1="220" x2="324" y2="220" stroke="#5c574d" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- card 1 -->
      <rect x="88" y="120" width="160" height="200" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
      <use href="#icon-bergamot" x="112" y="152" width="32" height="32"/>
      <use href="#icon-lavender" x="192" y="152" width="32" height="32"/>
      <use href="#icon-triangle" x="112" y="256" width="32" height="32"/>
      <use href="#icon-diamond" x="192" y="256" width="32" height="32"/>

      <!-- card 2 : identical layout -->
      <rect x="328" y="120" width="160" height="200" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
      <use href="#icon-bergamot" x="352" y="152" width="32" height="32"/>
      <use href="#icon-lavender" x="432" y="152" width="32" height="32"/>
      <use href="#icon-triangle" x="352" y="256" width="32" height="32"/>
      <use href="#icon-diamond" x="432" y="256" width="32" height="32"/>

      <text x="288" y="356" text-anchor="middle" font-family="'Jost', sans-serif" font-size="16" fill="#1b2f22">A clone tries to copy another fragrance's recipe.</text>

      <!-- RIGHT PANEL: alternative -->
      <!-- card A -->
      <rect x="560" y="120" width="160" height="200" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
      <circle cx="600" cy="168" r="22" fill="none" stroke="#b8904f" stroke-width="2"/>
      <circle cx="680" cy="168" r="22" fill="none" stroke="#b8904f" stroke-width="2"/>
      <use href="#icon-bergamot" x="584" y="152" width="32" height="32"/>
      <use href="#icon-lavender" x="664" y="152" width="32" height="32"/>
      <use href="#icon-triangle" x="584" y="256" width="32" height="32"/>
      <use href="#icon-diamond" x="664" y="256" width="32" height="32"/>

      <!-- card B -->
      <rect x="800" y="120" width="160" height="200" rx="8" fill="#ffffff" stroke="#1b2f22" stroke-width="1.5"/>
      <circle cx="840" cy="168" r="22" fill="none" stroke="#b8904f" stroke-width="2"/>
      <circle cx="920" cy="168" r="22" fill="none" stroke="#b8904f" stroke-width="2"/>
      <use href="#icon-bergamot" x="824" y="152" width="32" height="32"/>
      <use href="#icon-lavender" x="904" y="152" width="32" height="32"/>
      <use href="#icon-hexagon" x="824" y="256" width="32" height="32"/>
      <use href="#icon-star" x="904" y="256" width="32" height="32"/>

      <text x="760" y="350" text-anchor="middle" font-family="'Jost', sans-serif" font-size="16" fill="#1b2f22">
        <tspan x="760" dy="0">An alternative is a different recipe</tspan>
        <tspan x="760" dy="20">sharing some ingredients.</tspan>
      </text>
    </svg>
  </div>
</body>
</html>
